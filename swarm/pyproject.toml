[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agrivyaan_swarm"
version = "0.1.0"
description = "Multi-drone swarm simulation and replay dashboard for AgriVyaan precision agriculture."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AgriVyaan Team" }
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0"
]

[project.optional-dependencies]
dashboard = [
    "streamlit>=1.28.0",
    "plotly>=5.15.0"
]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0"
]
clustering = [
    "scikit-learn>=1.3.0"
]
sitl = [
    "pymavlink>=2.4.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
